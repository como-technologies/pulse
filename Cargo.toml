[workspace]
members = [
    "crates/pulse-crypto",
    "crates/pulse-protocol",
    "crates/pulse-identity",
    "crates/pulse-signal",
    "crates/pulse-server",
    "crates/pulse-relay",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
# Cryptography
blind-rsa-signatures = "0.17.1"
rsa = "0.9.10"
sha2 = "0.10.9"
hmac = "0.12.1"
aes-gcm = "0.10.3"
rand = "0.9.2"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
postcard = { version = "1.1", features = ["alloc"] }

# Async / HTTP
async-trait = "0.1"
axum = "0.8.8"
tokio = { version = "1.50.0", features = ["full"] }
tower = "0.5.3"
reqwest = { version = "0.12", features = ["json"] }

# Error handling
thiserror = "2.0.18"
anyhow = "1.0.102"

# Testing
proptest = "1.10.0"

# Utilities
uuid = { version = "1.22.0", features = ["v4", "serde"] }
base64 = "0.22.1"
hex = "0.4.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower-http = { version = "0.6.8", features = ["trace", "request-id", "util"] }
tracing-test = "0.2"
rusqlite = { version = "0.35", features = ["bundled"] }
tempfile = "3"
