name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly dependency-advisory sweep (Mondays 06:00 UTC): new RUSTSEC
    # advisories — and the ADR-0012 removal trigger — land without a code
    # change, so the audit job must run without waiting for a push.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

# Least privilege: CI only reads the repo (fmt/lint/test/audit, no
# publishing). Applies to every job that doesn't set its own.
permissions:
  contents: read

jobs:
  check:
    name: Check, Lint, Test
    # The weekly cron is the advisory sweep only — code hasn't changed.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Tests
        run: cargo test

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-audit

      - name: Audit
        run: just crate-audit
